// 힘 기반 배치: 노드끼리 밀어내기 + 연결선 당기기 + 중심으로 모으기
function layout(iterations) {
  const W = 1000, H = 700;
  nodes.forEach(n => {
    if (n.x === 0 && n.y === 0) {
      const a = Math.random() * Math.PI * 2, r = 80 + Math.random() * 220;
      n.x = W / 2 + Math.cos(a) * r; n.y = H / 2 + Math.sin(a) * r;
    }
  });
  for (let it = 0; it < iterations; it++) {
    const cool = 1 - it / iterations;
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d2 = dx * dx + dy * dy || 0.01;
        const f = 2600 / d2;
        const d = Math.sqrt(d2);
        dx /= d; dy /= d;
        a.vx += dx * f; a.vy += dy * f;
        b.vx -= dx * f; b.vy -= dy * f;
      }
    }
    edges.forEach(e => {
      const a = nodes[e.s], b = nodes[e.t];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 90) * 0.02;
      a.vx += dx / d * f; a.vy += dy / d * f;
      b.vx -= dx / d * f; b.vy -= dy / d * f;
    });
    nodes.forEach(n => {
      n.vx += (W / 2 - n.x) * 0.004;
      n.vy += (H / 2 - n.y) * 0.004;
      n.x += Math.max(-8, Math.min(8, n.vx)) * cool;
      n.y += Math.max(-8, Math.min(8, n.vy)) * cool;
      n.vx *= 0.6; n.vy *= 0.6;
    });
  }
  // 전체를 0~1000, 0~700 안에 맞춤
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  nodes.forEach(n => {
    n.x = 60 + (n.x - minX) / (maxX - minX || 1) * 880;
    n.y = 60 + (n.y - minY) / (maxY - minY || 1) * 580;
  });
}

function render() {
  edges.forEach((e, i) => {
    const a = nodes[e.s], b = nodes[e.t], el = edgeEls[i];
    el.setAttribute("x1", a.x); el.setAttribute("y1", a.y);
    el.setAttribute("x2", b.x); el.setAttribute("y2", b.y);
  });
  nodes.forEach((n, i) => {
    nodeEls[i].setAttribute("cx", n.x); nodeEls[i].setAttribute("cy", n.y);
    labelEls[i].setAttribute("x", n.x); labelEls[i].setAttribute("y", n.y - 9 - Math.min(n.degree, 30) * 0.3);
  });
}

// 필터 · 검색 · 강조
const activeGroups = () => new Set([...document.querySelectorAll(".grp:checked")].map(c => c.value));
let selected = null;

function applyFilter() {
  const groups = activeGroups();
  const q = document.getElementById("q").value.trim().toLowerCase();
  const showAll = document.getElementById("allLabels").checked;
  const visible = nodes.map(n => groups.has(n.group) &&
    (!q || n.label.toLowerCase().includes(q) || n.path.toLowerCase().includes(q) || n.title.toLowerCase().includes(q)));
  nodes.forEach((n, i) => {
    nodeEls[i].style.display = visible[i] ? "" : "none";
    // 연결이 적은 페이지는 라벨을 숨겨 겹침을 줄임 (선택하거나 '전체 라벨'을 켜면 표시)
    const labelOn = visible[i] && (showAll || n.degree >= 10 || n.id === selected);
    labelEls[i].style.display = labelOn ? "" : "none";
  });
  edges.forEach((e, i) => {
    edgeEls[i].style.display = visible[e.s] && visible[e.t] ? "" : "none";
  });
}

function highlight(id) {
  const neighbors = id == null ? null : adj[id];
  edges.forEach((e, i) => {
    const on = id != null && (e.s === id || e.t === id);
    edgeEls[i].setAttribute("class", "edge" + (on ? " hi" : (id != null ? " dim" : "")));
  });
  nodes.forEach((n, i) => {
    const on = id == null || n.id === id || (neighbors && neighbors.has(n.id));
    nodeEls[i].setAttribute("class", "node" + (n.id === id ? " sel" : "") + (on ? "" : " dim"));
    labelEls[i].setAttribute("class", "label" + (on ? "" : " dim"));
  });
}

function select(id) {
  selected = id;
  highlight(id);
  const n = nodes[id];
  document.getElementById("pTitle").textContent = n.title.split("|")[0].trim() || n.path;
  document.getElementById("pUrl").textContent = n.url;
  document.getElementById("pStats").textContent =
    `구분: ${GROUP_NAME[n.group]} · 나가는 링크 ${[...adj[id]].length}개 (연결된 페이지 수)`;
  document.getElementById("pOpen").href = n.url;
  panel.classList.add("show");
}

function clearSelection() {
  selected = null;
  highlight(null);
  panel.classList.remove("show");
}

let scale = 1, tx = 0, ty = 0, dragging = false, moved = false, lastX = 0, lastY = 0;
function applyView() { view.setAttribute("transform", `translate(${tx},${ty}) scale(${scale})`); }
function fit() {
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width / 1000, r.height / 700);
  scale = s; tx = (r.width - 1000 * s) / 2; ty = (r.height - 700 * s) / 2;
  applyView();
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = ev.deltaY < 0 ? 1.1 : 0.9;
  const ns = Math.max(0.3, Math.min(4, scale * k));
  tx = mx - (mx - tx) * (ns / scale);
  ty = my - (my - ty) * (ns / scale);
  scale = ns;
  applyView();
}, { passive: false });
svg.addEventListener("pointerdown", ev => {
  dragging = true; moved = false; lastX = ev.clientX; lastY = ev.clientY;
  svg.classList.add("dragging");
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (!dragging) return;
  const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  tx += dx; ty += dy; lastX = ev.clientX; lastY = ev.clientY;
  applyView();
});
svg.addEventListener("pointerup", () => { dragging = false; svg.classList.remove("dragging"); });
svg.addEventListener("click", () => { if (!moved) clearSelection(); });

render();
fit();
applyFilter();
